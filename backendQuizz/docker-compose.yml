services:
  database:
    container_name: quizz_database
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER:-quiz_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-quiz_local_dev}
      POSTGRES_DB: ${DATABASE_NAME:-quizz_db}
    ports:
      - "127.0.0.1:${DATABASE_HOST_PORT:-5433}:5432"
    volumes:
      - quizz_database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  quizz_database_data:
