spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: backendQuizz
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${DATABASE_NAME:quizz}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
