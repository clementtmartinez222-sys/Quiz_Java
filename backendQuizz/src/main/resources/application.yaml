spring:
  application:
    name: backendQuizz
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/quizz_db}
    username: ${DATABASE_USER:quiz_user}
    password: ${DATABASE_PASSWORD:quiz_local_dev}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      continue-on-error: false
server:
  port: ${SERVER_PORT:8080}
